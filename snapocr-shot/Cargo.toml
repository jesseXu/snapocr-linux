[package]
name = "snapocr-shot"
version = "0.1.0"
edition = "2021"
description = "冻结抓屏 + 框选浮层，输出 PNG。为 cosmic-comp 等现代 Wayland 合成器补上 grim+slurp 的空缺。"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.21"
memmap2 = "0.9"
png = "0.17"
anyhow = "1"
