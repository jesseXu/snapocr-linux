[package]
name = "snapocr-shot"
version = "0.1.0"
edition = "2021"
description = "Region screenshot tool for Wayland compositors that speak ext-image-copy-capture-v1 (e.g. cosmic-comp), where grim does not work."
license = "MIT"
repository = "https://github.com/jesseXu/snapocr"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.21"
memmap2 = "0.9"
png = "0.17"
anyhow = "1"
